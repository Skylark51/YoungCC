[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youngcc"
version = "0.1.0"
description = "Independent closed-shell Gaussian-basis electronic structure engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
youngcc = "opendft.cli:main"

[project.gui-scripts]
youngcc-gui = "opendft.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
