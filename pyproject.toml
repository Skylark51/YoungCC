[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youngcc"
version = "0.1.0"
description = "YoungCC electronic structure engine with optional unrestricted B3LYP backend"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]
advanced = ["pyscf>=2.9,<3", "pyscf-dispersion>=1.2"]

[project.scripts]
youngcc = "opendft.cli:main"

[project.gui-scripts]
youngcc-gui = "opendft.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["advanced: requires PySCF and dispersion"]
